{% extends base_template %} {% block title %}Add Project{% endblock %} {% block content %}
<div class="container py-4">
  <div class="card bg-dark border-secondary">
    <div class="card-header"><h5 class="mb-0">Add Impact Project</h5></div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="mt-3">
          <button type="submit" class="btn btn-primary">Save</button>
          <a href="{% url 'youth:index' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
