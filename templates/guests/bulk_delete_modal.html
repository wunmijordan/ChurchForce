<!-- Bulk Delete Modal — included via {% include %} from guest_list.html -->
<div
  class="modal fade"
  id="bulkDeleteModal"
  tabindex="-1"
  aria-labelledby="bulkDeleteModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form method="POST" action="{% url 'guests:bulk_delete_guests' %}">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title" id="bulkDeleteModalLabel">
            Bulk Delete Guests
          </h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
          ></button>
        </div>
        <div class="modal-body">
          <p class="text-secondary small">
            Select guests to permanently delete. This cannot be undone.
          </p>
          <div class="table-responsive">
            <table class="table table-dark table-hover align-middle">
              <thead>
                <tr>
                  <th>
                    <input
                      type="checkbox"
                      id="selectAllGuests"
                      class="form-check-input"
                    />
                    <label for="selectAllGuests" class="ms-1 small">All</label>
                  </th>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody>
                {% for guest in guests %}
                <tr>
                  <td>
                    <input
                      type="checkbox"
                      class="form-check-input guest-checkbox"
                      name="guest_ids"
                      value="{{ guest.id }}"
                    />
                  </td>
                  <td>
                    <span style="font-family: monospace"
                      >{{ guest.custom_id }}</span
                    >
                  </td>
                  <td>{{ guest.full_name }}</td>
                  <td>{{ guest.status }}</td>
                </tr>
                {% endfor %}
              </tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="btn btn-danger fw-bold"
            onclick="
              return confirm('Delete selected guests? This cannot be undone.');
            "
          >
            Delete Selected
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  document
    .getElementById("selectAllGuests")
    ?.addEventListener("change", function () {
      document
        .querySelectorAll(".guest-checkbox")
        .forEach((cb) => (cb.checked = this.checked));
    });
</script>
