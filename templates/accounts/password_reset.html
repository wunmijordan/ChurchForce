{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password — {% if church %}{{ church.name }}{% else %}ChurchForce{% endif %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'vendor/tabler/tabler.min.css' %}" rel="stylesheet">
  <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>
<body>
<div class="page page-center">
  <div class="container container-tight mt-6 py-5">
    <div class="text-center mb-4">
      <img src="{% static 'images/icons/icon-192x192.png' %}" alt="ChurchForce"
           style="width:56px;height:56px;border-radius:12px;">
      <h3 class="mt-2 fw-bold mb-0">Reset your password</h3>
      <p class="text-muted small">Enter the email address for your account and we'll send a reset link.</p>
    </div>
    <div class="card card-lg" style="box-shadow:0 4px 8px #000000d2;border-radius:36px;">
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" name="email" class="form-control" required
                   placeholder="you@example.com"
                   style="box-shadow:inset 0 4px 8px #000000d2;border-radius:24px;">
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold"
                  style="box-shadow:0 4px 8px #000000d2;border-radius:24px;">
            Send Reset Link
          </button>
        </form>
        <div class="text-center mt-3 small">
          <a href="{% url 'accounts:login' %}" class="text-secondary">Back to login</a>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
