{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check your email — ChurchForce</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'vendor/tabler/tabler.min.css' %}" rel="stylesheet">
  <link href="{% static 'css/custom.css' %}" rel="stylesheet">
</head>
<body>
<div class="page page-center">
  <div class="container container-tight mt-6 py-5 text-center">
    <div style="font-size:3.5rem;" class="mb-3">📬</div>
    <h2 class="fw-bold">Check your email</h2>
    <p class="text-muted">
      We've sent a password reset link to your email address.<br>
      The link expires in 24 hours. Check your spam folder if you don't see it.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-outline-secondary mt-2"
       style="border-radius:24px;">Back to Login</a>
  </div>
</div>
</body>
</html>
