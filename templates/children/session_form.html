{% extends "base.html" %} {% block title %}Create Session{% endblock %} {% block content %}
<div class="container py-4">
  <div class="card bg-dark border-secondary">
    <div class="card-header"><h5 class="mb-0">Create Check-In Session</h5></div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="mt-3">
          <button type="submit" class="btn btn-primary">Save</button>
          <a href="{% url 'children:index' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
