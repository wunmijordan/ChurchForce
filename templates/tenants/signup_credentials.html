{% extends base_template %}
{% block title %}Signup Credentials{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-7 col-lg-5">
      <div class="card bg-gray-900"
           style="box-shadow:0 6px 12px #000000d2;border-radius:36px;border:var(--tabler-gray-400);">
        <div class="card-header d-flex align-items-center gap-2 py-3"
             style="border-bottom: 2px solid var(--church-primary);border-radius:36px 36px 0 0;
                    background:linear-gradient(135deg,var(--church-primary-dark),var(--tblr-gray-900));">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
            <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/>
            <path d="M6 21v-2a4 4 0 0 1 4 -4h5"/>
            <path d="M18.5 18.5l-3.5 3.5l-1.5 -1.5"/>
            <path d="M18.554 18.414a2 2 0 1 1 2.828 -2.828a2 2 0 0 1 -2.828 2.828"/>
            <path d="M16 19l1 1"/>
          </svg>
          <h2 class="mb-0 fw-bold">Signup Credentials</h2>
        </div>

        <div class="card-body p-4">
          <div class="alert alert-warning py-2 small fw-bold mb-4">
            <kbd>These credentials are shown once in dev only.<br> Copy them now.</kbd>
          </div>

          <div class="mb-4">
            <label class="form-label text-muted mb-0 small fw-bold text-uppercase">Admin Name</label>
            <div class="fw-bold fs-3 text-warning">{{ credentials.full_name }}</div>
          </div>

          <div class="mb-4">
            <label class="form-label text-muted mb-0 small fw-bold text-uppercase">Username</label>
            <div class="input-group" style="box-shadow:inset 0 4px 8px #000000d2;border-radius:24px;">
              <input type="text" class="form-control font-monospace" style="box-shadow:inset 0 4px 8px #000000d2;border-radius:24px 0 0 24px;" id="usernameField" value="{{ credentials.username }}" readonly />
              <button class="btn copy-btn" style="background:{{ church.primary_color }}22;box-shadow:inset 0 4px 8px #000000d2;border-radius:0 24px 24px 0;" data-target="usernameField" type="button" title="Copy">Copy</button>
            </div>
          </div>

          <div class="mb-4">
            <label class="form-label text-muted mb-0 small fw-bold text-uppercase">Password</label>
            <div class="input-group" style="box-shadow:inset 0 4px 8px #000000d2;border-radius:24px;">
              <input type="text" class="form-control font-monospace" style="box-shadow:inset 0 4px 8px #000000d2;border-radius:24px 0 0 24px;" id="passwordField" value="{{ credentials.temp_password }}" readonly />
              <button class="btn copy-btn" style="background:{{ church.primary_color }}22;box-shadow:inset 0 4px 8px #000000d2;border-radius:0 24px 24px 0;" data-target="passwordField" type="button" title="Copy">Copy</button>
            </div>
          </div>

          <a href="{{ next_url }}" class="btn w-100 fw-bold" style="background: #ff5e01; color: #fff; box-shadow:0 4px 8px #000000d2;border-radius:24px;">
            Continue to Login
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  document.querySelectorAll(".copy-btn").forEach((btn) => {
    btn.addEventListener("click", function () {
      const field = document.getElementById(this.dataset.target);
      field.select();
      field.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(field.value).then(() => {
        const orig = this.textContent;
        this.textContent = "Copied";
        setTimeout(() => { this.textContent = orig; }, 1200);
      });
    });
  });
</script>
{% endblock %}
